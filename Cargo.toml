[workspace]
members = ["game", "term"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
hecs = { version = "0.11.1", features = ["row-serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
ron = { version = "0.12.2", features = ["integer128"] }
rand = "0.10.3"
rand_pcg = { version = "0.10.2", features = ["serde"] }
ratatui = "0.30.2"
directories = "6.0.0"
