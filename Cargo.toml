[workspace]
members = ["game", "term"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
hecs = { version = "0.11.1", features = ["row-serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
rand = "0.10.3"
rand_pcg = "0.10.2"
ratatui = "0.30.2"
