[workspace]
members = ["game", "front", "gui", "bench"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
hecs = { version = "0.11.1", features = ["row-serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
ron = { version = "0.12.2", features = ["integer128"] }
rand = "0.10.3"
rand_pcg = { version = "0.10.2", features = ["serde"] }
directories = "6.0.0"
# The windowed frontend (ADR 0020); egui is reached as `eframe::egui`.
eframe = "0.37.0"
egui_kittest = "0.37.0"
# Decodes the sprite atlas (ADR 0023); already built for eframe, PNG only.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Property tests over generated play (docs/plans/content-free-tests.md); a dev-dependency of
# `game` only, so the game's own randomness rules are untouched. No forking or timeouts.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
